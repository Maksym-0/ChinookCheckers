name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

# A newer push to the same branch / PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Only the test projects (and the Core / Application layers they reference) are built.
      # Infrastructure wraps the Windows-only Kingsrow64.dll, so it is deliberately not part of the Linux run.
      - name: Test
        run: dotnet test ChinookCheckers.slnx --configuration Release --verbosity normal
